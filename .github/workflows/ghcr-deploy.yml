name: Publish Docker Image

on:
  workflow_run:
    workflows: ["BA+FA CI + Auto Release"]
    types: [completed]
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Push Image to GHCR
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout repository at workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(tr -d ' \n\r\t' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release tag points to this commit
        id: tagcheck
        shell: bash
        run: |
          git fetch --tags --force
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" = "${{ env.HEAD_SHA }}" ]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if no release tag for this commit
        if: steps.tagcheck.outputs.deploy != 'true'
        run: echo "No release tag on this commit; skipping deploy."

      - name: Extract metadata
        if: steps.tagcheck.outputs.deploy == 'true'
        id: meta
        shell: bash
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER_LC}/configviz"

          echo "version=${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.tagcheck.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.tagcheck.outputs.deploy == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.tagcheck.outputs.deploy == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          platforms: linux/amd64