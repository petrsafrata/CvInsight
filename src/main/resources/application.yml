spring:
  application:
    name: CvInsight

  general-config:
    api-version: v1

  # DB connection string
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${POSTGRES_DB:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}

  # JPA setings
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  # Flyway setings
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

# DB logging
logging:
  level:
    org.hibernate.SQL: warn

# Info cache settings
info:
  cacheTtlMs: 600000 # Cache expiration time in milliseconds (10 minutes)

# JWT settings
security:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-secure-secret-at-least-32-bytes}
    accessTokenTtlSeconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refreshTokenTtlSeconds: ${JWT_REFRESH_TTL_SECONDS:604800}

# CV extraction and parsing settings
cv:
  extraction:
    supported-media-types: application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document

  check:
    min-readable-font-size: 3.0
    white-color: FFFFFF
    white-color-threshold: 0.99

    media-types:
      pdf: application/pdf
      doc: application/msword
      docx: application/vnd.openxmlformats-officedocument.wordprocessingml.document

  parse:
    instructions: classpath:prompts/cv/parse-instructions.md
    schema: classpath:prompts/cv/parse-schema.json

  analysis:
    instructions: classpath:prompts/cv/analysis-instructions.md
    schema: classpath:prompts/cv/analysis-schema.json

# OpenAI API settings
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com/v1
  model: gpt-6-luna

# Actuator config
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

# Server settings
server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:200}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:10}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:5s}