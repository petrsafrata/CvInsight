spring:
  application:
    name: CvInsight

  general-config:
    api-version: v1

  # DB connection string
  datasource:
    url: jdbc:postgresql://localhost:5432/cvinsight # URL for connecting to the PostgreSQL database
    username: cv
    password: cv

  # JPA setings
  jpa:
    hibernate:
      ddl-auto: update   # Development: update, Production: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  # Flyway setings
  flyway:
    enabled: false  # Development: false, Production: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# DB logging
logging:
  level:
    org.hibernate.SQL: warn

# Info cache settings
info:
  cacheTtlMs: 600000 # Cache expiration time in milliseconds (10 minutes)

# JWT settings
security:
  jwt:
    secret: change-me-to-a-secure-secret-at-least-32-bytes
    accessTokenTtlSeconds: 900
    refreshTokenTtlSeconds: 604800

# CV extraction and parsing settings
cv:
  extraction:
    supported-media-types: application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document

  check:
    min-readable-font-size: 3.0
    white-color: FFFFFF
    white-color-threshold: 0.99

    media-types:
      pdf: application/pdf
      doc: application/msword
      docx: application/vnd.openxmlformats-officedocument.wordprocessingml.document

  parse:
    instructions: classpath:prompts/cv/parse-instructions.md
    schema: classpath:prompts/cv/parse-schema.json

  analysis:
    instructions: classpath:prompts/cv/analysis-instructions.md
    schema: classpath:prompts/cv/analysis-schema.json

# OpenAI API settings
openai:
  api-key:
  base-url: https://api.openai.com/v1
  model: gpt-6-luna

# Actuator config
management:
  endpoints:
    web:
      base-path: /actuator # The base path for all Actuator endpoints, e.g. /actuator/health, /actuator/info, etc.
      exposure:
        include: health,info,metrics # List of Actuator endpoints that will be exposed, in this case health, info and metrics
  endpoint:
    health:
      show-details: always # Show health status details at all times, even for unauthenticated users, making it easier to diagnose issues during development

# Server settings
server:
  servlet:
    context-path: /api # Base path for all API endpoints, e.g. /api/connections, /api/audit, etc.