spring:
  application:
    name: Spring-project-template

  # DB connection string
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb # URL pro připojení k PostgreSQL databázi
    username: test
    password: test

  # JPA setings
  jpa:
    hibernate:
      ddl-auto: update   # Vývoj: update, Produkce: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  # Flyway setings
  flyway:
    enabled: false  # Vyvoj: false, Produkce: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# DB logging
logging:
  level:
    org.hibernate.SQL: warn

# Release notes cache settings
releaseNotes:
  cacheTtlMs: 600000 # Doba platnosti cache pro releasenotes v milisekundách (10 minut), aby se snížil počet dotazů na databázi při načítání releasenotes

# Actuator config
management:
  endpoints:
    web:
      base-path: /actuator # Základní cesta pro všechny Actuator endpointy, např. /actuator/health, /actuator/info, atd.
      exposure:
        include: health,info,metrics # Seznam Actuator endpointů, které budou vystaveny, v tomto případě health, info a metrics
  endpoint:
    health:
      show-details: always # Zobrazit podrobnosti o stavu zdraví vždy, i pro neautentizované uživatele, což usnadní diagnostiku problémů během vývoje

# Server settings
server:
  servlet:
    context-path: /api # Základní cesta pro všechny API endpointy, např. /api/predict, /api/movies, atd.