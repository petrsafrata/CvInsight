version: "3.9"

services:
  # =========================
  # DATABASE
  # =========================
  db:
    image: postgres:16-alpine
    container_name: db-postgres
    environment:
      POSTGRES_DB: cvinsight
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cv -d cvinsight" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"