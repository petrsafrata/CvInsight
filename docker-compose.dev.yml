version: "3.9"

services:
  # =========================
  # DATABASE
  # =========================
  db:
    image: postgres:16-alpine
    container_name: db-postgres
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: test # Pro vývoj pevně nastaveno, ve finále předělat na env variable
      POSTGRES_PASSWORD: test # Pro vývoj pevně nastaveno, ve finále předělat na env variable
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test -d testdb" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"